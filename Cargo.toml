[package]
name = "tmux-ratlette"
version = "0.4.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Native command palette for tmux"
license = "MIT"
repository = "https://github.com/num13ru/tmux-ratlette"
readme = "README.md"
keywords = ["tmux", "terminal", "tui", "productivity"]
categories = ["command-line-utilities"]
include = [
    "/CHANGELOG.md",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/bin/tmux-palette.sh",
    "/src/**",
    "/tests/**",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"

[lib]
name = "tmux_ratlette"
path = "src/lib.rs"

[[bin]]
name = "tmux-ratlette"
path = "src/main.rs"
